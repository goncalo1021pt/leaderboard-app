name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app is not scaffolded yet (see build order, step 1). Until package.json
      # exists there is nothing to check, and this job passes trivially.
      # Delete this step once the scaffold lands.
      - id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet — nothing to check."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scaffold.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.scaffold.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check
        if: steps.scaffold.outputs.ready == 'true'
        run: make check
