name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs pnpm directly rather than through `make check`. The Makefile wraps every
  # command in Docker because there is no Node on a developer's host; a CI runner
  # already has one, and going through Docker here would only cost minutes.
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    # The db test project needs a real Postgres, the same major version as the
    # stack. Its tests create and migrate their own scratch database.
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: leaderboard
          POSTGRES_PASSWORD: leaderboard
          POSTGRES_DB: leaderboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaderboard -d leaderboard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://leaderboard:leaderboard@localhost:5432/leaderboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      # `drizzle-kit check` only proves the migration history is consistent.
      # It does not notice a schema edit nobody generated a migration for, so
      # also regenerate and fail if that writes anything.
      - name: Migration history is consistent
        run: pnpm db:check

      - name: Every schema change has a migration
        run: |
          pnpm db:generate --name ci_drift_probe
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "::error::lib/db/schema has changes with no migration. Run 'make db-generate NAME=...' and commit the result."
            git status --porcelain -- drizzle/
            exit 1
          fi

      - name: Tests
        run: pnpm test

  # The homelab runs the `runner` stage. Building it here means a broken
  # Dockerfile fails in a pull request rather than during a deploy.
  image:
    name: production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
