name: leaderboard

services:
  app:
    build:
      context: .
      target: dev
    # Run as the host user so everything written into the bind mount —
    # node_modules, .next, generated migrations — stays owned by you rather
    # than by root. DOCKER_UID/DOCKER_GID are exported by the Makefile.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: pnpm dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      # Bind mounts on Linux deliver inotify events natively, so polling stays
      # off. Set WATCHPACK_POLLING=true in .env if hot reload ever misses edits.
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-false}"
      # Dev values only. Production sets every one of these itself.
      DATABASE_URL: "postgres://leaderboard:leaderboard@db:5432/leaderboard"
      BETTER_AUTH_URL: "http://localhost:3000"
      BETTER_AUTH_SECRET: "dev-only-secret-never-use-in-production-0123456789"
      # Every email the app sends lands in Mailpit: http://localhost:8025
      SMTP_URL: "smtp://mailpit:1025"
      MAIL_FROM: "Leaderboard <leaderboard@localhost>"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: leaderboard
      POSTGRES_DB: leaderboard
    # Bound to localhost only, so a GUI client on the host can connect without
    # the database being reachable from the rest of the network. 5433 rather
    # than 5432 so it coexists with any other Postgres on the machine; override
    # with POSTGRES_HOST_PORT in .env.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep their data in a version-named subdirectory of
      # this path, so a future major upgrade does not clobber it.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d leaderboard"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Catches outgoing email so magic-link login works with no email provider.
  # Its inbox is at http://localhost:8025; nothing ever leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"

volumes:
  db-data:
